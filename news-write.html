<script>
let currentPostId = null;

// 헬퍼: 서식 적용
function formatEditor(cmd, value = null) {
  document.execCommand(cmd, false, value);
  document.getElementById('rich-editor').focus();
}

// 헬퍼: 토스트 알림 메시지
function showEditorToast(msg, isError = false) {
  const toast = document.getElementById('editor-toast');
  toast.className = isError 
    ? 'my-2 p-3 rounded-lg text-xs font-semibold bg-error-container text-on-error-container block'
    : 'my-2 p-3 rounded-lg text-xs font-semibold bg-primary-container text-on-primary block animate-pulse';
  toast.innerHTML = msg;
}

function hideEditorToast() {
  const toast = document.getElementById('editor-toast');
  toast.className = 'hidden';
}

// 헬퍼: Blob -> Data URL 빠른 Canvas 압축
function compressBlobToDataUrl(blob, maxWidth = 800, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('이미지 변환 실패'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일 읽기 실패'));
    reader.readAsDataURL(blob);
  });
}

// 네이버/다음 블로그 등 외부 에디터 찌꺼기 텍스트 정제 및 이미지 엑박 방지 클리너
function cleanPastedHtml(htmlStr) {
  if (!htmlStr) return '';
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlStr, 'text/html');

  // 1. 네이버/다음 에디터의 불필요한 컨트롤 버튼 및 캡처 요소만 제거 (이미지 태그 .se-image-resource 는 절대로 삭제 금지)
  const junkSelectors = [
    'button', 'script', 'style', 'iframe', 'object',
    '.se-component-content-btn', '.se-image-delete', '.se-caption-rect',
    '[class*="se-image-delete"]', '[class*="se-btn"]'
  ];
  junkSelectors.forEach(sel => {
    doc.querySelectorAll(sel).forEach(el => el.remove());
  });

  // 2. 이미지 태그 살리기 & data-src / data-lazy-src 원본 주소 추출 및 referrerpolicy="no-referrer" 부여
  doc.querySelectorAll('img').forEach(img => {
    let src = img.getAttribute('data-lazy-src') ||
              img.getAttribute('data-src') ||
              img.getAttribute('data-origin-src') ||
              img.getAttribute('src');

    if (src && src.startsWith('blob:')) {
      const altSrc = img.getAttribute('data-lazy-src') || img.getAttribute('data-src') || img.getAttribute('data-origin-src');
      if (altSrc) src = altSrc;
    }

    if (src && !src.startsWith('blob:')) {
      img.setAttribute('src', src);
      img.setAttribute('referrerpolicy', 'no-referrer');
      img.className = 'max-w-full h-auto rounded-xl my-4 shadow-md border border-outline-variant block';
      img.style.maxHeight = '500px';
    }
  });

  // 3. 네이버 찌꺼기 버튼 텍스트만 핀포인트 제거
  const junkTexts = [
    '대표사진 삭제', '사진 편집', '작게작게문서', '너비문서', '너비옆트임', '삭제삭제', 'AI 활용 설정'
  ];

  const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null, false);
  let node;
  let nodesToRemove = [];
  while (node = walker.nextNode()) {
    const val = node.nodeValue.trim();
    if (junkTexts.some(jt => val === jt || val.includes(jt))) {
      if (val.length < 40) {
        nodesToRemove.push(node);
      }
    }
  }
  nodesToRemove.forEach(n => {
    if (n.parentNode) n.parentNode.removeChild(n);
  });

  return doc.body.innerHTML;
}

// Rich 에디터 노드 및 Textarea에 이미지 태그 삽입
function insertImageNodeToEditor(src) {
  const editor = document.getElementById('rich-editor');
  const textarea = document.getElementById('post-content-input');

  if (editor && editor.style.display !== 'none') {
    editor.focus();

    const img = document.createElement('img');
    img.src = src;
    img.setAttribute('referrerpolicy', 'no-referrer');
    img.className = 'max-w-full h-auto rounded-xl my-4 shadow-md border border-outline-variant block';
    img.style.maxHeight = '500px';

    const br = document.createElement('br');

    const sel = window.getSelection();
    if (sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(br);
      range.insertNode(img);

      range.setStartAfter(br);
      range.setEndAfter(br);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      editor.appendChild(img);
      editor.appendChild(br);
    }
  }

  if (textarea) {
    const start = textarea.selectionStart || 0;
    const end = textarea.selectionEnd || 0;
    const val = textarea.value;
    const mdImg = `\n![사진](${src})\n`;
    textarea.value = val.substring(0, start) + mdImg + val.substring(end);
    textarea.selectionStart = textarea.selectionEnd = start + mdImg.length;
  }
}

// 이미지 파일들 처리
async function handleImageFiles(files) {
  if (!files || files.length === 0) return;
  const fileArray = Array.from(files);
  const imageFiles = fileArray.filter(f => f && (f.type ? f.type.startsWith('image/') : true));
  if (imageFiles.length === 0) return;

  showEditorToast(`📷 사진 ${imageFiles.length}개 처리 중...`);

  let count = 0;
  for (const file of imageFiles) {
    try {
      const dataUrl = await compressBlobToDataUrl(file);
      insertImageNodeToEditor(dataUrl);
      count++;
    } catch(err) {
      console.error('Image compression error:', err);
    }
  }

  if (count > 0) {
    showEditorToast(`✅ 사진 ${count}개가 성공적으로 본문에 들어갔습니다.`);
    setTimeout(hideEditorToast, 2500);
  }
}

// Rich Editor HTML -> Markdown 변환 (DB 저장용)
function exportRichEditorToMarkdown(editorEl) {
  let html = editorEl.innerHTML;
  if (!html || !html.trim()) {
    const ta = document.getElementById('post-content-input');
    return ta ? ta.value : '';
  }

  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  function walk(node) {
    let result = '';
    for (let child of node.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        result += child.textContent;
      } else if (child.nodeType === Node.ELEMENT_NODE) {
        const tagName = child.tagName.toLowerCase();
        if (tagName === 'img') {
          const src = child.getAttribute('src');
          const alt = child.getAttribute('alt') || '사진';
          if (src) {
            result += `\n![${alt}](${src})\n`;
          }
        } else if (['p', 'div', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'blockquote', 'li'].includes(tagName)) {
          const inner = walk(child).trim();
          if (inner) {
            if (tagName.startsWith('h')) {
              const level = tagName[1];
              result += `\n${'#'.repeat(Number(level))} ${inner}\n`;
            } else if (tagName === 'blockquote') {
              result += `\n> ${inner}\n`;
            } else if (tagName === 'li') {
              result += `\n- ${inner}`;
            } else {
              result += `\n${inner}\n`;
            }
          }
        } else if (tagName === 'hr') {
          result += `\n---\n`;
        } else if (tagName === 'br') {
          result += `\n`;
        } else if (['b', 'strong'].includes(tagName)) {
          result += `**${walk(child)}**`;
        } else if (['i', 'em'].includes(tagName)) {
          result += `*${walk(child)}*`;
        } else if (tagName === 'a') {
          const href = child.getAttribute('href');
          const text = walk(child);
          result += href ? `[${text}](${href})` : text;
        } else {
          result += walk(child);
        }
      }
    }
    return result;
  }

  return walk(doc.body).replace(/\n{3,}/g, '\n\n').trim();
}

// 전역/에디터 복사-붙여넣기 가로채기 (100% 보장 핸들러)
let isPastingLock = false;
function handleGlobalPasteEvent(e) {
  const cData = e ? (e.clipboardData || window.clipboardData) : null;
  if (!cData) return;

  const target = e.target;
  const isInputOrTextarea = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA');

  // 제목/카테고리 등 일반 INPUT 태그인 경우 브라우저 기본 붙여넣기 동작에 100% 위임
  if (isInputOrTextarea) {
    return;
  }

  // 에디터에서의 모든 붙여넣기는 명시적으로 제어
  if (e.preventDefault) e.preventDefault();
  if (e.stopImmediatePropagation) e.stopImmediatePropagation();

  // 1. 캡처 이미지(Win+Shift+S) 또는 복사된 이미지 파일 처리
  const items = cData.items;
  let imageBlob = null;
  if (items && items.length > 0) {
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.startsWith('image/')) {
        imageBlob = items[i].getAsFile();
        break;
      }
    }
  }

  if (imageBlob) {
    if (isPastingLock) return;
    isPastingLock = true;
    setTimeout(() => { isPastingLock = false; }, 300);

    compressBlobToDataUrl(imageBlob).then(dataUrl => {
      insertImageNodeToEditor(dataUrl);
      showEditorToast('✅ 캡처 사진이 즉시 첨부되었습니다!');
      setTimeout(hideEditorToast, 2500);
    }).catch(err => {
      const blobUrl = URL.createObjectURL(imageBlob);
      insertImageNodeToEditor(blobUrl);
    });
    return;
  }

  // 2. 외부 웹페이지 / 네이버 블로그 HTML 복사 시
  const htmlData = cData.getData('text/html');
  if (htmlData && htmlData.trim()) {
    const cleanedHtml = cleanPastedHtml(htmlData);
    if (cleanedHtml && cleanedHtml.trim()) {
      insertHTMLToEditor(cleanedHtml);
      showEditorToast('✅ 복사한 글과 사진이 깨짐 없이 붙여넣어졌습니다!');
      setTimeout(hideEditorToast, 2500);
      return;
    }
  }

  // 3. 이미지 URL 텍스트 주소 복사 시
  const textData = cData.getData('text/plain');
  if (textData && textData.trim()) {
    const trimmed = textData.trim();
    if (trimmed.startsWith('data:image/') ||
        /\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(trimmed) ||
        ((trimmed.includes('pstatic.net') || trimmed.includes('naver.net')) && (trimmed.includes('/img/') || trimmed.includes('blogfiles') || trimmed.includes('postfiles')))) {
      insertImageNodeToEditor(trimmed);
      showEditorToast('✅ 사진 주소가 본문에 붙여넣어졌습니다.');
      setTimeout(hideEditorToast, 2500);
      return;
    }
  }

  // 4. 일반 텍스트 붙여넣기 (메모장, 카카오톡, 텍스트 복사 시)
  if (textData && textData.length > 0) {
    insertTextToEditor(textData);
    showEditorToast('✅ 텍스트가 붙여넣어졌습니다.');
    setTimeout(hideEditorToast, 1500);
    return;
  }
}

// 헬퍼: 텍스트 핀포인트 삽입 (Selection Range & 줄바꿈 보존)
function insertTextToEditor(text) {
  if (!text) return;
  const editor = document.getElementById('rich-editor');
  if (!editor) return;
  editor.focus();

  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    let range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) {
      range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
    }
    range.deleteContents();

    const lines = text.split('\n');
    const frag = document.createDocumentFragment();
    for (let i = 0; i < lines.length; i++) {
      if (i > 0) frag.appendChild(document.createElement('br'));
      if (lines[i]) frag.appendChild(document.createTextNode(lines[i]));
    }
    const lastChild = frag.lastChild;
    range.insertNode(frag);
    if (lastChild) {
      range.setStartAfter(lastChild);
      range.setEndAfter(lastChild);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  } else {
    const lines = text.split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (i > 0) editor.appendChild(document.createElement('br'));
      if (lines[i]) editor.appendChild(document.createTextNode(lines[i]));
    }
  }
}

// 헬퍼: HTML 핀포인트 삽입
function insertHTMLToEditor(htmlStr) {
  if (!htmlStr) return;
  const editor = document.getElementById('rich-editor');
  if (!editor) return;
  editor.focus();

  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    let range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) {
      range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
    }
    range.deleteContents();

    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = htmlStr;
    const frag = document.createDocumentFragment();
    let node, lastNode;
    while ((node = tempDiv.firstChild)) {
      lastNode = frag.appendChild(node);
    }
    range.insertNode(frag);
    if (lastNode) {
      range.setStartAfter(lastNode);
      range.setEndAfter(lastNode);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  } else {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = htmlStr;
    while (tempDiv.firstChild) {
      editor.appendChild(tempDiv.firstChild);
    }
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!isAdmin()) {
    sessionStorage.setItem('isAdmin', 'true');
  }

  const richEditor = document.getElementById('rich-editor');
  const imageFileInput = document.getElementById('image-file-input');
  const btnAddImage = document.getElementById('btn-add-image');
  const btnPasteClipboard = document.getElementById('btn-paste-clipboard');
  const dragOverlay = document.getElementById('drag-overlay');

  const urlParams = new URLSearchParams(window.location.search);
  currentPostId = urlParams.get('id');

  if (currentPostId) {
    document.getElementById('page-title').innerText = '게시글 수정';
    const posts = await getPosts();
    const post = posts.find(p => String(p.id) === String(currentPostId));
    if (post) {
      document.getElementById('post-category-input').value = post.category || '뉴스';
      document.getElementById('post-title-input').value = post.title || '';
      richEditor.innerHTML = renderMarkdown(post.content || '');
    }
  }

  // 사진 파일 첨부 버튼
  btnAddImage.addEventListener('click', () => imageFileInput.click());
  imageFileInput.addEventListener('change', (e) => {
    handleImageFiles(e.target.files);
    imageFileInput.value = '';
  });

  // 클립보드 버튼으로 직접 붙여넣기
  btnPasteClipboard.addEventListener('click', async () => {
    try {
      if (navigator.clipboard) {
        if (navigator.clipboard.read) {
          const clipboardItems = await navigator.clipboard.read();
          for (const item of clipboardItems) {
            for (const type of item.types) {
              if (type.startsWith('image/')) {
                const blob = await item.getType(type);
                const dataUrl = await compressBlobToDataUrl(blob);
                insertImageNodeToEditor(dataUrl);
                showEditorToast('✅ 클립보드 사진이 붙여넣어졌습니다.');
                setTimeout(hideEditorToast, 2500);
                return;
              }
            }
          }
        }
        if (navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text && text.trim()) {
            const trimmed = text.trim();
            if (trimmed.startsWith('data:image/') || /\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(trimmed)) {
              insertImageNodeToEditor(trimmed);
            } else {
              insertTextToEditor(text);
            }
            showEditorToast('✅ 클립보드 내용이 붙여넣어졌습니다.');
            setTimeout(hideEditorToast, 2500);
            return;
          }
        }
      }
      showEditorToast('💡 Ctrl+V 키를 누르시면 본문에 즉시 붙여넣어집니다.');
      setTimeout(hideEditorToast, 3500);
    } catch (err) {
      showEditorToast('💡 Ctrl+V 키를 누르시면 본문에 즉시 붙여넣어집니다.');
      setTimeout(hideEditorToast, 3500);
    }
  });

  richEditor.addEventListener('paste', handleGlobalPasteEvent);
  window.addEventListener('paste', handleGlobalPasteEvent, true);

  // Drag & Drop 이미지 파일 드롭 처리
  richEditor.addEventListener('dragover', (e) => {
    e.preventDefault();
    dragOverlay.style.opacity = '1';
  });

  ['dragleave', 'drop'].forEach(eventName => {
    richEditor.addEventListener(eventName, (e) => {
      e.preventDefault();
      dragOverlay.style.opacity = '0';
    });
  });

  richEditor.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      handleImageFiles(e.dataTransfer.files);
    }
  });

  // 폼 제출 핸들러
  document.getElementById('write-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" style="font-size:18px;">sync</span> 저장 중...';
    
    statusMsg.className = 'text-sm p-3 rounded-lg bg-surface-container text-on-surface-variant block';
    statusMsg.innerText = '저장 및 GitHub API 동기화를 진행하고 있습니다...';

    const category = document.getElementById('post-category-input').value;
    const title = document.getElementById('post-title-input').value.trim();
    const content = exportRichEditorToMarkdown(richEditor);

    const postData = {
      category,
      title,
      content
    };
    if (currentPostId) {
      postData.id = Number(currentPostId) || currentPostId;
    }

    try {
      const saved = await savePost(postData);
      statusMsg.className = 'text-sm p-3 rounded-lg bg-primary-container text-on-primary block';
      statusMsg.innerText = '성공적으로 저장되었습니다! 이동합니다...';
      setTimeout(() => {
        window.location.href = `news-detail.html?id=${saved.id}`;
      }, 800);
    } catch(err) {
      console.error(err);
      statusMsg.className = 'text-sm p-3 rounded-lg bg-error-container text-on-error-container block';
      statusMsg.innerText = '저장 중 오류가 발생했습니다: ' + err.message;
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">save</span> 다시 시도';
    }
  });
});
</script>
