<script>
document.addEventListener('DOMContentLoaded', async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const postId = urlParams.get('id');

  if (!postId) {
    alert('잘못된 접근입니다.');
    window.location.href = 'news.html';
    return;
  }

  const posts = await getPosts();
  const post = posts.find(p => String(p.id) === String(postId));

  if (!post) {
    document.getElementById('post-title').innerText = '게시글을 찾을 수 없습니다.';
    document.getElementById('post-content').innerHTML = '<p class="text-error">요청하신 게시글이 존재하지 않거나 삭제되었습니다.</p>';
    return;
  }

  document.getElementById('post-title').innerText = post.title || '';
  document.getElementById('post-category').innerText = post.category || '뉴스';
  document.getElementById('post-date').innerText = post.date || '';
  document.getElementById('post-content').innerHTML = renderMarkdown(post.content || '');

  if (isAdmin()) {
    const adminActions = document.getElementById('admin-actions');
    adminActions.classList.remove('hidden');
    
    document.getElementById('edit-btn').onclick = () => {
      window.location.href = `news-write.html?id=${post.id}`;
    };

    document.getElementById('delete-btn').onclick = async () => {
      if (confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
        await deletePost(post.id);
        alert('게시글이 삭제되었습니다.');
        window.location.href = 'news.html';
      }
    };
  }
});
</script>
